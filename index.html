    <script>
      // Gracefully prevent benign Vite WebSocket/HMR connection notices from showing error overlays
      window.addEventListener('unhandledrejection', function (event) {
        if (event && event.reason) {
          var msg = (event.reason.message || String(event.reason) || '').toLowerCase();
          if (msg.includes('websocket') || msg.includes('closed without opened')) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }
      });
      window.addEventListener('error', function (event) {
        var msg = ((event.message || '') + ' ' + (event.error?.message || '')).toLowerCase();
        if (msg.includes('websocket') || msg.includes('closed without opened')) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return false;
        }
      });
    </script>
